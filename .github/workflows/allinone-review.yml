name: Validar AB-ALLinONE R2
on:
  push:
    branches: [main, feat/ab-allinone-foundation]
    paths: [lib/allinone/**, allinone/**, app/allinone/**, public/allinone-assets/**, scripts/allinone-*, tsconfig.allinone.json, package.json, lib/supabase*.ts, app/api/blog/**, components/blog/newsletter-form.tsx, docs/REVISAO_AB_ALLINONE_R2.md, .github/workflows/allinone-review.yml]
  pull_request:
    paths: [lib/allinone/**, allinone/**, app/allinone/**, public/allinone-assets/**, scripts/allinone-*, tsconfig.allinone.json, package.json, lib/supabase*.ts, app/api/blog/**, components/blog/newsletter-form.tsx]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: allinone-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: allinone_r2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIO_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/allinone_r2_test
      AIO_POSTGREST_DATABASE_URL: postgresql://ab_aio_test_transport:local-test-only@127.0.0.1:5432/allinone_r2_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Compilar aplicação e verificar invariantes
        run: |
          set -euo pipefail
          mkdir -p allinone-evidence
          if bash -o pipefail -c 'false | tee /dev/null'; then echo 'PIPELINE_NOT_FAIL_CLOSED'; exit 1; fi
          npm run build 2>&1 | tee allinone-evidence/build.log
          node --check scripts/allinone-browser.cjs
          node --check scripts/allinone-e2e.cjs
          node scripts/allinone-verify.cjs | tee allinone-evidence/contracts.json
          node allinone/tests/hardening.cjs | tee allinone-evidence/hardening.json
      - name: Banco real, permissões, concorrência e revogação
        run: |
          set -euo pipefail
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN; CREATE ROLE ab_aio_test_transport LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'local-test-only'; GRANT service_role TO ab_aio_test_transport;"
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f allinone/migrations/001_core.sql 2>&1 | tee allinone-evidence/migration-001.log
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO anon,authenticated;'
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f allinone/migrations/002_privileges.sql 2>&1 | tee allinone-evidence/migration-002.log
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f allinone/migrations/003_hardening.sql 2>&1 | tee allinone-evidence/migration-003.log
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f allinone/tests/database.sql 2>&1 | tee allinone-evidence/database.log
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f allinone/tests/hardening.sql 2>&1 | tee allinone-evidence/database-r2.log
          python3 allinone/tests/concurrency.py | tee allinone-evidence/concurrency.json
          python3 allinone/tests/revocation.py | tee allinone-evidence/revocation.json
      - name: Ferramentas de ensaio com versão e integridade explícitas
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/aio-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.63.0
          node "$RUNNER_TEMP/aio-browser/node_modules/playwright/cli.js" install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/aio-postgrest"
          curl -fsSL --max-time 60 https://github.com/PostgREST/postgrest/releases/download/v16.4/postgrest-v16.4-linux-static-x86-64.tar.xz -o "$RUNNER_TEMP/aio-postgrest/bin.tar.xz"
          echo "b47ecc82fce1dcebbbc4183d839e52f07f7630c9d7ad0f54db753d1939299354  $RUNNER_TEMP/aio-postgrest/bin.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/aio-postgrest/bin.tar.xz" -C "$RUNNER_TEMP/aio-postgrest"
      - name: Navegador sem banco e integração com banco real
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/aio-browser/node_modules/playwright"
          export AIO_POSTGREST_BIN="$RUNNER_TEMP/aio-postgrest/postgrest"
          AIO_TEST_OUTPUT="$PWD/allinone-evidence/browser-disconnected" node scripts/allinone-browser.cjs
          AIO_TEST_OUTPUT="$PWD/allinone-evidence/e2e-connected" node scripts/allinone-e2e.cjs
          if test -f scripts/allinone-build-smoke.cjs; then node scripts/allinone-build-smoke.cjs | tee allinone-evidence/build-smoke.json; fi
      - name: Preparar módulo e evidências sem segredos
        run: |
          set -euo pipefail
          mkdir -p allinone-release
          tar -cf - lib/allinone allinone app/allinone public/allinone-assets tsconfig.allinone.json scripts/allinone-verify.cjs scripts/allinone-browser.cjs scripts/allinone-e2e.cjs package.json .github/workflows/allinone-review.yml lib/supabase-admin.ts lib/supabase.ts lib/admin-auth.ts app/api/blog components/blog/newsletter-form.tsx | tar -xf - -C allinone-release
          if test -f scripts/allinone-build-smoke.cjs; then cp scripts/allinone-build-smoke.cjs allinone-release/scripts/; fi
          mkdir -p allinone-release/docs
          cp docs/HANDOFF_AB_ALLINONE.md allinone-release/docs/
          if test -f docs/REVISAO_AB_ALLINONE_R2.md; then cp docs/REVISAO_AB_ALLINONE_R2.md allinone-release/docs/; fi
          cp -r allinone-evidence allinone-release/validation
          git rev-parse HEAD > allinone-release/COMMIT.txt
          printf '%s\n' 'Módulo R2 para integrar ao portfólio existente. Não contém credenciais produtivas, dependências, fontes tipográficas nem inventário privado. Screenshots usam exclusivamente dados sintéticos persistidos no PostgreSQL local de teste. Nenhum deployment administrativo produtivo foi realizado por este workflow.' > allinone-release/LEIA-ME.txt
          find allinone-release -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > allinone-release/SHA256SUMS
          sha256sum --check allinone-release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AB-ALLinONE-R2-validado
          path: allinone-release/
          include-hidden-files: true
          retention-days: 14
