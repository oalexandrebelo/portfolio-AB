name: Validar Estudos e GeoKPI
on:
  push:
    branches: [main, feat/studies-mapcn-release, feat/estudos-geokpi-v3]
    paths: [study-map/**, lib/estudos/**, scripts/studies-*.mjs, scripts/studies-*.cjs, private-studies/**, package.json, .github/workflows/studies-map.yml]
  pull_request:
    paths: [study-map/**, lib/estudos/**, scripts/studies-*.mjs, scripts/studies-*.cjs, private-studies/**, package.json]
permissions:
  contents: read
concurrency:
  group: studies-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/studies-map-prepare.mjs
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run prebuild
