name: Validar Estudos e mapa
on:
  push:
    branches: [main, feat/studies-mapcn-release]
    paths: [study-map/**, lib/estudos/**, scripts/studies-*.mjs, private-studies/**, package.json, .github/workflows/studies-map.yml]
  pull_request:
    paths: [study-map/**, lib/estudos/**, scripts/studies-*.mjs, private-studies/**, package.json]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/studies-map-prepare.mjs
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run prebuild
