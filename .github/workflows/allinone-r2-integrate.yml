name: Integrar revisao R2
on:
  push:
    branches: [feat/ab-allinone-foundation]
    paths: [scripts/allinone-r2-ui.py, .github/workflows/allinone-r2-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: allinone_r2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIO_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/allinone_r2_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ab-allinone-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/allinone-r2-ui.py
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run prebuild
      - name: Validar banco R2
        run: |
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f allinone/migrations/001_core.sql
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f allinone/migrations/002_privileges.sql
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f allinone/migrations/003_hardening.sql
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f allinone/tests/database.sql
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f allinone/tests/hardening.sql
          python3 allinone/tests/concurrency.py
      - name: Verificar navegador local com código real
        run: |
          npm install --prefix "$RUNNER_TEMP/aio-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.63.0
          node "$RUNNER_TEMP/aio-browser/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/aio-browser/node_modules/playwright" node scripts/allinone-browser.cjs
      - name: Versionar somente fontes validadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/allinone/ui.ts lib/allinone/contracts.ts public/allinone-assets/app.js public/allinone-assets/app.css scripts/allinone-browser.cjs package.json
          git commit -m 'fix(allinone): integra reconciliacao, busca e isolamento de estado da interface'
          git push origin HEAD:feat/ab-allinone-foundation
