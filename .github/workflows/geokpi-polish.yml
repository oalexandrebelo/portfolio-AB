name: Finalizar verificacao GeoKPI
on:
  push:
    branches: [feat/estudos-geokpi-v3]
    paths: [.github/workflows/geokpi-polish.yml]
permissions:
  contents: write
concurrency:
  group: geokpi-polish
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/estudos-geokpi-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/geokpi-polish-once.mjs
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run prebuild
      - name: Versionar somente os refinamentos aprovados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add study-map/workspace.tsx scripts/studies-geokpi-browser.cjs
          git commit -m 'fix(estudos): alinha ranking ao KPI e preserva exportacoes numericas'
          git push origin HEAD:feat/estudos-geokpi-v3
