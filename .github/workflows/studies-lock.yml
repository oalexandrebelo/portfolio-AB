name: Sincronizar dependencias corrigidas
on:
  push:
    branches: [ab-estudos-private]
    paths: [package.json, .github/workflows/studies-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab-estudos-private
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Versionar lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: sincroniza lockfile das dependencias corrigidas'
            git push origin HEAD:ab-estudos-private
          fi
