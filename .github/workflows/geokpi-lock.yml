name: Sincronizar lock GeoKPI
on:
  push:
    branches: [feat/estudos-geokpi-v3]
    paths: [study-map/package.json, .github/workflows/geokpi-lock.yml]
permissions:
  contents: write
concurrency:
  group: geokpi-lock
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/estudos-geokpi-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix study-map --package-lock-only --include=dev --ignore-scripts --no-audit --no-fund
      - name: Sincronizar versao travada
        run: |
          if ! git diff --quiet -- study-map/package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add study-map/package-lock.json
            git commit -m 'chore(estudos): trava dependencias do GeoKPI'
            git push origin HEAD:feat/estudos-geokpi-v3
          fi
